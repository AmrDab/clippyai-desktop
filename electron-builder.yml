appId: ai.cloudana.clippyai
productName: ClippyAI
copyright: Copyright © 2026 Cloudana · ClippyAI
# Shown in the "File description" field of Properties → Details.
# Becomes the exe's FileVersion (rcedit --set-file-version), so it must be
# 4-part numeric. Convention for prereleases: 4th field = prerelease number
# (0.20.0-alpha.24 → 0.20.0.24). For a stable X.Y.Z use X.Y.Z.0.
# macOS ignores this: CFBundleVersion comes from mac.bundleVersion, which
# `npm run dist:mac` sets to package.json's X.Y.Z (max 3 parts on macOS).
buildVersion: 0.21.0.0
extraMetadata:
  description: ClippyAI — Your AI desktop buddy
  author:
    name: Cloudana
    email: hello@clippyai.app

# clippyai://activate?t=<token> — one-click license activation from the
# key-delivery email. Registers the scheme in the NSIS installer (Windows
# registry) and in Info.plist (macOS). Handled in src/main/index.ts.
protocols:
  - name: ClippyAI
    schemes:
      - clippyai

win:
  target:
    - target: nsis
      arch: x64
  icon: build/icon.ico
  # Cert subject is "Amro Dabbas" — must match for SmartScreen trust attribution.
  publisherName: Amro Dabbas
  legalTrademarks: ClippyAI is a trademark of Cloudana.
  requestedExecutionLevel: asInvoker
  artifactName: ClippyAI-Setup-${version}.${ext}
  # === CODE SIGNING (Azure Trusted Signing) ===
  # Wired in v0.11.19. Cert profile: clippyai-cert.
  # Wrapper: build/signing/sign.js calls SignTool with the TrustedSigning DLib.
  # Auth: %USERPROFILE%\.azure\clippyai-signing-creds.json (gitignored) or
  # AZURE_TENANT_ID/AZURE_CLIENT_ID/AZURE_CLIENT_SECRET env vars (CI).
  signAndEditExecutable: true
  signingHashAlgorithms:
    - sha256
  sign: ./build/signing/sign.js
  forceCodeSigning: true
  verifyUpdateCodeSignature: true
  # Windows-only trims (merged with the top-level `files` list). The alpha.24
  # installer grew from 145 MB (v0.17.7) to 266 MB; these are the inclusions
  # that can never be loaded by a win32-x64 build:
  #   - onnxruntime-node ships prebuilt addons for every platform
  #     (darwin 35 MB, linux 53 MB, win32/arm64 65 MB) — only win32/x64 loads.
  #   - onnxruntime-web (128 MB): @huggingface/transformers' node bundle
  #     inlines the ORT web runtime and only require()s onnxruntime-node /
  #     onnxruntime-common; nothing in out/ references onnxruntime-web.
  #   - harper.js: harper-lint.ts imports the "." entry (index.js) and reads
  #     harper_wasm_bg.wasm from disk; the inlined/slim variants (66 MB) are
  #     separate entry points nothing imports.
  # The two positive patterns are REQUIRED: a files list of only "!" patterns
  # makes electron-builder assume "**/*" and pack the whole repo (src/,
  # vendor/, .wrangler/ dev state, a 2nd 57 MB whisper model) into app.asar.
  files:
    - out/**/*
    - assets/**/*
    - "!assets/agents/**"
    - "!**/node_modules/onnxruntime-node/bin/napi-v6/{darwin,linux}/**"
    - "!**/node_modules/onnxruntime-node/bin/napi-v6/win32/arm64/**"
    - "!**/node_modules/onnxruntime-web/**"
    - "!**/node_modules/harper.js/dist/{binaryInlined.js,slimBinaryInlined.js,slimBinary.js,harper_wasm_slim_bg.wasm}"
  # Windows-only resources (merged with the top-level extraResources).
  extraResources:
    - from: assets/scripts
      to: scripts
      filter:
        - "*.ps1"
    # v0.17.0 — whisper.cpp + quantized base.en model for offline STT.
    # Total ~60 MB (~57 MB model, ~2.3 MB binaries). Used by src/main/stt.ts
    # which spawns whisper-cli.exe with the bundled model and a WAV file
    # recorded in the renderer via Web Audio API. Lives at runtime under
    # process.resourcesPath/whisper/.
    - from: vendor/whisper/bin
      to: whisper
      filter:
        - "*.exe"
        - "*.dll"

mac:
  category: public.app-category.productivity
  icon: build/icon.icns
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    # ZIP target is required by electron-updater on macOS — the auto-update
    # flow downloads and unpacks the ZIP in place rather than re-mounting a
    # DMG.
    - target: zip
      arch:
        - arm64
        - x64
  hardenedRuntime: true
  gatekeeperAssess: false       # we run our own assess after stapling
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # codesign identity auto-matched against any "Developer ID Application: …"
  # cert in Keychain. CSC_NAME or CSC_LINK env vars override in CI.
  notarize: false               # we drive notarytool ourselves in afterSign
  artifactName: ClippyAI-${version}-${arch}.${ext}
  # TCC usage-description strings injected into the .app's Info.plist.
  # macOS shows these in the consent dialogs when Clippy first calls AX /
  # Screen Recording / AppleEvents. Without them the prompts show generic
  # text and users deny.
  extendInfo:
    NSAccessibilityUsageDescription: "ClippyAI uses Accessibility APIs to find buttons, type text, and click items in other apps for you."
    NSScreenCaptureUsageDescription: "ClippyAI captures the screen to read what you're working on (used for OCR + screen context). Captures stay on your Mac."
    NSAppleEventsUsageDescription: "ClippyAI uses AppleScript to control Mail, Safari, and Chrome on your behalf when you ask it to."
    # Without the mic string getUserMedia hard-fails on a signed hardened-
    # runtime build (no TCC dialog at all). The packaged app is the TCC
    # responsible process for the spawned bridge's `transcribe` too.
    NSMicrophoneUsageDescription: "ClippyAI uses the microphone so you can talk to Clippy (push-to-talk). Audio is transcribed on this Mac by default."
    NSSpeechRecognitionUsageDescription: "ClippyAI transcribes your voice commands on-device using Apple's speech recognition. Audio stays on your Mac."
  # Harper reads its WASM via fs.readFile(file://…) and onnxruntime-node's
  # .node addon must load from disk — both need real files outside app.asar.
  asarUnpack:
    - "**/node_modules/harper.js/**"
    - "**/node_modules/onnxruntime-node/**"
  # macOS-only resources (merged with the top-level extraResources).
  extraResources:
    # whisper.cpp universal binary built by scripts/vendor-whisper.js.
    - from: vendor/whisper/macos
      to: whisper
      filter:
        - "whisper-cli"
        - "*.dylib"
    # Swift helpers built by `npm run build-native` (universal arm64+x86_64).
    # Resolved via process.resourcesPath in src/main/screenshot-helper.ts and
    # src/main/mac-bridge-native.ts; signed with the parent .app.
    - from: native/screenshot-helper/.build/release/screenshot-helper
      to: screenshot-helper
    - from: native/clippy-mac-bridge/.build/release/clippy-mac-bridge
      to: clippy-mac-bridge
    # Listen-only keyboard monitor for opt-in typing awareness (Input
    # Monitoring TCC). Only spawned once the user enables it in Settings.
    - from: native/clippy-input-monitor/.build/release/clippy-input-monitor
      to: clippy-input-monitor
  # CRITICAL: installed Macs update from the R2 feed (latest-mac.yml on
  # download.clippyai.app). Without this override the top-level GitHub
  # publish config is baked into app-update.yml and mac users stop updating.
  publish:
    provider: generic
    url: https://download.clippyai.app
    channel: latest

dmg:
  title: ClippyAI ${version}
  icon: build/icon.icns
  contents:
    - x: 130
      y: 220
      type: file
    - x: 410
      y: 220
      type: link
      path: /Applications
  window:
    width: 540
    height: 380

nsis:
  # oneClick MUST be true for reliable auto-updates. The update loop bug:
  # oneClick:false + allowToChangeInstallationDirectory meant the NSIS
  # silent update (/S --updated) couldn't find the install path → installed
  # to a different directory → relaunched the OLD exe → loop.
  # VS Code, Slack, Discord all use oneClick for this exact reason.
  oneClick: true
  perMachine: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: ClippyAI
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  uninstallDisplayName: ClippyAI — AI Desktop Buddy
  runAfterFinish: true
  deleteAppDataOnUninstall: true
  include: build/installer.nsh

files:
  - out/**/*
  - assets/**/*
  # v0.21 — the sprite maps (~11 MB) are imported by the renderer and already
  # bundled into out/renderer/assets; the raw copies were packed twice.
  - "!assets/agents/**"
  - "!**/node_modules/*/{CHANGELOG.md,README.md,readme.md,readme,README,*.d.ts,__tests__,test,tests,docs,doc}"
  - "!**/node_modules/*/*.map"
  - "!**/node_modules/**/*.map"

extraResources:
  # (Windows-only *.ps1 scripts + whisper.exe binaries live under win:,
  # macOS whisper + Swift helpers under mac:.)
  # v0.11.22 — Bundle ClawdCursor's app-specific guide JSONs (Outlook,
  # Excel, Slack, Edge, Discord, Spotify, etc.). Read at runtime by
  # src/main/guides.ts and injected into the model's screen-context
  # block when the active window's processName matches a guide. Lets
  # the model use known-good keyboard shortcuts (Ctrl+Enter to send in
  # Outlook) instead of trying to coordinate-click — which failed in
  # report fbfc636e... when the AI guessed Send was at (188, 187).
  - from: vendor/clawdcursor/guides
    to: clawdcursor-guides
    filter:
      - "*.json"
  # Quantized base.en whisper model (~57 MB), shared by both platforms.
  - from: vendor/whisper/models
    to: whisper/models
    filter:
      - "*.bin"
  # brain/*.md — startup health-check artifacts read by src/main/orient.ts
  # (the active system prompt is server-side). Missing files log an ERROR
  # at every launch, so ship them like the macOS build does.
  - from: assets/brain
    to: brain
    filter:
      - "*.md"
  # v0.21 — "Connect an agent". The stdio bridge (run by Claude Desktop via
  # the app exe + ELECTRON_RUN_AS_NODE=1) and the Agent Skills file must be
  # real files on disk, outside app.asar, on both Windows and macOS:
  # src/main/agent-connect.ts resolves them under process.resourcesPath.
  - from: resources/mcp
    to: mcp
    filter:
      - "*.js"
  - from: assets/agent-skill
    to: agent-skill
    filter:
      - "**/SKILL.md"
  # (Historical) brain/*.md were removed from extraResources — GUIDANCE prompt assembly was
  # deleted in v0.8.0 when we moved identity/prompts server-side. The .md
  # files remain in the repo as documentation but are NOT bundled anymore.

# rcedit embeds the Clippy icon + ProductName/FileDescription into the inner
# ClippyAI.exe after electron-builder packs it. Without this the exe shows the
# default Electron icon and "Electron" in Windows taskbar/Alt-Tab. Disabled in
# v0.7.5 as a red-herring diagnostic; re-enabled here because the actual
# install failures were NSIS integrity / antivirus / browser cache issues
# unrelated to rcedit.
afterPack: scripts/after-pack.js
# Apple notarization + stapling (no-op on non-darwin and without APPLE_* env).
afterSign: build/signing/notarize.js

directories:
  output: release
  buildResources: build

publish:
  provider: github
  owner: AmrDab
  repo: clippyai-desktop
