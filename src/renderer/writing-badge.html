<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
  <style>
    :root {
      --clippy: #ffce33;
      --clippy-edge: #e8b71f;
      --ink: #1c1c1e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
      -webkit-user-select: none; user-select: none;
      cursor: pointer;
    }
    /* The pill sits inset so its drop-shadow isn't clipped by the window. */
    .badge {
      position: absolute; inset: 5px;
      display: flex; align-items: center; gap: 7px;
      padding: 0 12px;
      border-radius: 999px;
      background: linear-gradient(180deg, #fff7dd 0%, var(--clippy) 100%);
      border: 1px solid var(--clippy-edge);
      box-shadow: 0 3px 10px rgba(20, 22, 26, 0.22), inset 0 1px 0 rgba(255,255,255,0.7);
      color: var(--ink);
      transition: transform 0.12s ease, box-shadow 0.12s ease, opacity 0.18s ease;
      animation: pop 0.22s cubic-bezier(0.2, 0.9, 0.3, 1.2) both;
    }
    .badge:hover { transform: translateY(-1px); box-shadow: 0 5px 14px rgba(20,22,26,0.28), inset 0 1px 0 rgba(255,255,255,0.7); }
    .badge:active { transform: translateY(0.5px); }
    .clip { font-size: 15px; line-height: 1; }
    .count {
      font-weight: 700; font-size: 13px;
      min-width: 16px; height: 16px;
      display: inline-flex; align-items: center; justify-content: center;
      padding: 0 4px;
      background: var(--ink); color: #fff;
      border-radius: 8px;
    }
    .label { font-size: 12px; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; }
    @keyframes pop { from { opacity: 0; transform: scale(0.86); } to { opacity: 1; transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) { .badge { animation: none; } }
  </style>
</head>
<body>
  <div class="badge" id="badge" role="button" aria-label="Clippy spotted writing fixes — click to review">
    <span class="clip" aria-hidden="true">📎</span>
    <span class="count" id="count">1</span>
    <span class="label">fix it</span>
  </div>
  <script>
    const countEl = document.getElementById('count');
    const labelEl = document.querySelector('.label');
    function render(n) {
      const c = Math.max(1, Number(n) || 1);
      countEl.textContent = String(c);
      labelEl.textContent = c === 1 ? 'fix it' : 'fixes';
    }
    window.clippy?.onWritingBadgeCount?.(render);
    document.getElementById('badge').addEventListener('click', () => {
      window.clippy?.writingBadgeOpen?.();
    });
  </script>
</body>
</html>
