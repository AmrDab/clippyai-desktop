name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # npm 11 wrote package-lock.json; npm 10 (Node 22) rejects it.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run unit
      - run: npm test
      - run: node scripts/smoke.js --layer=1
      - run: npm run build
      # Swift helpers (clippy-mac-bridge, screenshot-helper, clippy-input-monitor),
      # universal arm64+x86_64. Build only — no signing / notarization in CI.
      - if: runner.os == 'macOS'
        run: npm run build-native
