name: CI (Windows)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # npm 11 wrote package-lock.json; npm 10 (Node 22) rejects it.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run unit
      - run: npm test
      - run: node scripts/smoke.js --layer=1
      - run: npm run build
